# 게이트 기본 정책 (설명용 참고 파일).
#
# 게이트는 이 파일을 읽지 않는다. 기본값은 gate/policy.py에 있고, tests/test_policy.py가 이 파일과 같은지 확인한다.
# 사용자 정책은 `gate policy` 명령으로 정책 파일(기본 hackathon/gate-data/policy.yaml, GATE_POLICY)에 따로 저장한다.
# 정책 파일에 없는 설정은 아래 기본값을 쓴다. 사용자 정책에서는 설정을 점 표기 키로 쓴다(예: numbers.rrn.visible).

# 정규식이 찾은 번호·비밀값 종류별 처리.
#   action: mask(가려서 보여줌) | ask_human(사람에게 물어봄, 승인해도 가린 채로 보여줌) | deny(파일 전체 거부)
#   visible: 가릴 때 남길 부분. 기본은 전부 가림(구분자만 남김)
numbers:
  rrn:            # 주민등록번호. visible: none | birth(앞 6자리) | birth_gender(앞 7자리)
    action: mask
    visible: none
  foreigner_rrn:  # 외국인등록번호. visible: none | birth | birth_gender
    action: mask
    visible: none
  card:           # 카드번호. visible: none | last4(끝 4자리)
    action: mask
    visible: none
  mobile:         # 휴대폰 번호. visible: none | prefix(010 등 앞자리)
    action: mask
    visible: none
  phone:          # 일반 전화번호. visible: none | area(지역번호)
    action: mask
    visible: none
  email:          # 이메일. visible: none | tld(.com 등 최상위 도메인)
    action: mask
    visible: none
  account:        # 계좌번호. visible: none만
    action: mask
    visible: none
  secret:         # 비밀값: 설정 파일의 비밀번호·API 키·토큰·개인 키 본문. visible: none만 (값만 가리고 키 이름은 남긴다)
    action: mask
    visible: none

# NER(이름·연락처·소속 등)과 규칙(IP·내부 주소)이 찾은 개체 묶음별 처리 (3c, 3e).
#   action: allow(그대로 보여줌) | mask(가려서 보여줌, `[이름]`처럼 종류 이름으로) | ask_human | deny
#   NER 묶음은 ner_backend가 server일 때만 쓴다. host는 규칙(gate/host_rules.py)이 찾아 NER을 꺼도 쓴다.
#   전화번호·이메일을 NER이 찾으면 위 numbers 칸을 따른다(정규식이 같은 곳을 찾았으면 정규식이 우선).
#   date(날짜)·event(사건)는 2026-11-01 NER 교체로 뺐다. 예전 정책 파일에 있으면 읽되 효과가 없고, 새로 지정할 수 없다.
entities:
  name:        {action: mask}   # 이름 (상담사·가족·교수 이름 포함)
  address:     {action: mask}   # 주소 (NER 연락처 중 한글이 있는 상세 주소)
  birth:       {action: mask}   # 생년월일
  student_id:  {action: mask}   # 식별번호: 학번·사번·여권번호·면허번호 등
  org:         {action: mask}   # 소속: 학교·학과/부서·회사/기관·병원·모임 이름
  place:       {action: mask}   # 장소
  etc:         {action: mask}   # 기타: 메신저·SNS 아이디 같은 그 밖의 연락처
  host:        {action: mask}   # IP 주소·내부 주소 (규칙으로 찾음, NER을 꺼도 적용)
  plain:       {action: allow}  # 나이 (그것만으로는 사람을 좁히기 어려워 기본으로 보여 줌)

# NER 서버(nerserve, README 참고). 끄면(none) 이름·주소 등은 가리지 않고 3b와 똑같이 동작한다.
# 켜면(server) 가린 것이 있는 문서는 가린 결과를 Jev에 다시 물어, 안전하면 가린 채 보여 주고 아니면 사람에게 묻는다.
# NER 서버가 없으면 모든 읽기가 차단된다.
ner_backend: none            # none(끔) | server (데몬 환경변수 NER_BASE_URL 필요)
ner_timeout_seconds: 10.0    # 이 시간 안에 답이 없으면 차단

# Jev 답에 따른 처리 (명세 3.4). 그 사이 구간은 사람 승인.
thresholds:
  allow_if_safe_confidence_gte: 0.95      # safe이고 확신도가 이 값 이상이면 허용
  deny_if_sensitive_confidence_gte: 0.95  # safe가 아니고 확신도가 이 값 이상이면 차단

jev_backend: mock            # mock(키워드 규칙, 시험용) | laya(로컬 laya-serve. 데몬 환경변수 JEV_BASE_URL 등 필요, README 참고)
jev_timeout_seconds: 3.0     # 이 시간 안에 답이 없으면 차단
max_inspect_bytes: 200000    # Jev에 한 번에 넘기는 최대 바이트. 넘으면 나눠서 묻고 가장 엄격한 답을 쓴다

# 사람 승인 (Phase 5). 판단이 ask_human이면 사용자에게 묻는다: 맥 대화상자, 또는 사용자 터미널에서 gate approve / gate deny.
# 승인해도 번호·비밀값은 가린 채로 보여 준다. 원본을 그대로 보여 주는 길은 경로 규칙 allow뿐이다.
approval:
  timeout_seconds: 30.0      # 이 시간 안에 답이 없으면 차단
  session_minutes: 60        # '이 폴더 허용'을 기억하는 시간(분). 데몬이 끝나면 사라진다. 0이면 이 선택지를 없앤다

# 경로 규칙: 내용을 보기 전에 경로로 정한다. allow | ask_human | deny. 여러 개가 맞으면 가장 엄격한 것.
# `/`가 없는 패턴은 어느 깊이에서든 이름과 맞춘다. deny·ask_human은 대소문자를 무시한다.
path_rules:
  - {pattern: "*.env", action: deny}
  - {pattern: ".env.*", action: deny}
  - {pattern: "*.pem", action: deny}
  - {pattern: "*.key", action: deny}
  - {pattern: "id_rsa*", action: deny}
  - {pattern: "id_ed25519*", action: deny}
  - {pattern: ".netrc", action: deny}
  - {pattern: ".npmrc", action: deny}
  - {pattern: ".pypirc", action: deny}
  - {pattern: ".pgpass", action: deny}
  - {pattern: ".git-credentials", action: deny}
  - {pattern: "credentials.json", action: deny}
  - {pattern: "**/.aws/credentials", action: deny}
  - {pattern: "*.p12", action: deny}
  - {pattern: "*.pfx", action: deny}
  - {pattern: "*.jks", action: deny}
  - {pattern: "*.keystore", action: deny}

# 맥락 규칙(사용자 문장, 예: "병원 기록은 보여주지 마")은 기본으로 없다. 넣으면 Jev 질문의 "사용자 정책" 칸에 들어간다.
context_rules: []
