[project]
name = "fuse-jev-gate"
version = "0.1.0"
description = "PLANT: AI 에이전트가 원본 파일을 검사(정규식 + NER + 판단 모델 + 정책 + 사람 승인)를 거쳐서만 읽게 하는 도구"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "mfusepy>=3.1.1",
    "pyyaml>=6.0.3",
]

[project.scripts]
plant = "gate.cli:main"
# 예전 이름. 이미 쓰던 설정·스크립트가 깨지지 않게 남겨 둔 별칭이다(도움말·안내에는 plant만 보인다)
gate = "gate.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["gate"]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
