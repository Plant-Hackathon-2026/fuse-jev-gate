[project]
name = "fuse-jev-gate"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "mfusepy>=3.1.1",
    "pyyaml>=6.0.3",
]

[project.scripts]
gate = "gate.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["gate"]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
